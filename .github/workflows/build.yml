name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Buildozer and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config cmake libffi-dev libssl-dev zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5
          pip3 install --upgrade pip
          pip3 install buildozer "cython==0.29.36" virtualenv

      - name: Build APK
        run: |
          yes | buildozer -v android debug > build.log 2>&1 || (tail -n 80 build.log && exit 1)

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: foner-game-apk
          path: bin/*.apk
          
